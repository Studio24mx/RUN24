name: Deploy RUN24 Web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_VERSION="4.7.2"
          RELEASE="4.7.2-stable"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${RELEASE}/Godot_v${RELEASE}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${RELEASE}_linux.x86_64"
          sudo mv "Godot_v${RELEASE}_linux.x86_64" /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot-builds/releases/download/${RELEASE}/Godot_v${RELEASE}_export_templates.tpz" -O templates.tpz
          mkdir -p templates
          unzip -q templates.tpz -d templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -r templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Validate project
        run: godot --headless --path . --quit-after 60

      - name: Smoke test progression
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Export Web
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
